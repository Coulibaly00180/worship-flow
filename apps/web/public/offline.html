<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors-ligne — Worship Flow</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf8f2; color: #271f17;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
    main { max-width: 420px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { color: #5b5040; line-height: 1.6; margin: 0 0 20px; }
    a, button { display: inline-block; background: #8c2a3e; color: #fff; border: 0; border-radius: 999px;
                padding: 10px 22px; font-weight: 700; text-decoration: none; cursor: pointer; font-size: 1rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #17120e; color: #f3ebdd; }
      p { color: #cfc3ae; }
      a, button { background: #f2a7b5; color: #3b0e18; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Vous êtes hors-ligne</h1>
    <p>Cette page n'a pas été enregistrée sur cet appareil. Les chants et partitions marqués
       « Disponible hors-ligne » restent consultables depuis l'application.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
