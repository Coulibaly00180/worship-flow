version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Regroupe les montées mineures/patch pour limiter le bruit ; les majeures restent séparées
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majeures à planifier à la main (migration de code nécessaire)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: monthly
